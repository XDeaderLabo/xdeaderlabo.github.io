<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#11131d">
<title>XDL OS 1.3.0</title>
<style>
:root{
  color-scheme:dark;
  --accent:#ff9b55;--accent-rgb:255,155,85;--accent-soft:rgba(255,155,85,.16);
  --bg:#10121c;--text:#f6f5fb;--muted:#a6a9ba;
  --glass:rgba(23,26,39,.72);--glass-strong:rgba(27,30,45,.91);
  --line:rgba(255,255,255,.11);--shadow:0 28px 80px rgba(0,0,0,.42);
  --wallpaper:radial-gradient(ellipse at 18% 15%,#47345f 0,transparent 38%),radial-gradient(ellipse at 82% 85%,#8d493b 0,transparent 42%),linear-gradient(135deg,#111827,#17152c 55%,#241a2b);
  --radius:22px;
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{overflow:hidden;background:var(--wallpaper);background-size:cover;color:var(--text);font-family:Inter,"Segoe UI",system-ui,Arial,sans-serif;user-select:none}
button,input,textarea,select{font:inherit}
button{color:inherit;border:1px solid var(--line);background:rgba(255,255,255,.075);padding:9px 13px;border-radius:12px;cursor:pointer;transition:background .18s,border-color .18s,transform .18s}
button:hover{background:rgba(255,255,255,.14);border-color:rgba(var(--accent-rgb),.65)}
button:active{transform:scale(.97)}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--accent);color:#21150e;border-color:transparent;font-weight:750}
button.danger{background:rgba(225,75,85,.16);border-color:rgba(255,100,110,.35)}
input,textarea,select{width:100%;color:var(--text);background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:12px;padding:11px 12px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{min-height:125px;resize:vertical;user-select:text}
::selection{background:rgba(var(--accent-rgb),.35)}
#bootScreen{position:fixed;inset:0;z-index:50000;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,#29243e,#0c0e16 68%);transition:opacity .65s,visibility .65s}
#bootScreen.done{opacity:0;visibility:hidden;pointer-events:none}
.boot-inner{text-align:center;animation:bootRise .9s both}
.brand-mark{width:100px;height:100px;position:relative;margin:0 auto 22px;filter:drop-shadow(0 0 22px rgba(var(--accent-rgb),.22))}
.brand-mark svg{width:100%;height:100%;overflow:visible}
.brand-mark .star{fill:#ffd66b;filter:drop-shadow(0 0 8px #ffc84d);animation:starFlash 1.3s ease-in-out infinite alternate}
.brand-mark .star.two{animation-delay:.65s}
.boot-title{font-size:clamp(25px,5vw,36px);font-weight:850;letter-spacing:.17em}
.boot-sub{color:var(--muted);font-size:11px;letter-spacing:.28em;margin-top:8px}
.boot-progress{width:190px;height:3px;background:#ffffff19;border-radius:10px;margin:30px auto 0;overflow:hidden}
.boot-progress:after{content:"";display:block;height:100%;width:42%;background:var(--accent);border-radius:10px;animation:bootLoad 1.4s ease-in-out infinite}
#desktop{position:fixed;inset:0 0 72px 0;opacity:0;animation:desktopIn .7s .45s forwards}
#desktop.ready{opacity:1}
#ambientGlow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 100%,rgba(var(--accent-rgb),.08),transparent 55%)}
#desktopIcons{position:relative;z-index:1;display:grid;grid-template-columns:repeat(1,92px);gap:10px;padding:22px;width:112px}
.desktop-icon{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 6px;border:1px solid transparent;border-radius:17px;text-align:center;font-size:12px;cursor:pointer;transition:.2s}
.desktop-icon:hover,.desktop-icon:focus{background:rgba(255,255,255,.11);border-color:var(--line);backdrop-filter:blur(12px);transform:translateY(-2px);outline:none}
.desktop-icon .emoji{font-size:30px;filter:drop-shadow(0 5px 8px #0005)}
#windows{position:absolute;inset:0;pointer-events:none}
.window{position:absolute;width:min(700px,calc(100vw - 28px));height:min(520px,calc(100vh - 112px));min-width:285px;min-height:230px;display:flex;flex-direction:column;background:var(--glass-strong);border:1px solid rgba(255,255,255,.14);border-radius:var(--radius);box-shadow:var(--shadow);backdrop-filter:blur(30px) saturate(145%);overflow:hidden;pointer-events:auto;animation:windowIn .24s cubic-bezier(.2,.8,.2,1)}
.window.hidden{display:none}
.window.maximized{inset:10px!important;width:auto!important;height:auto!important}
.titlebar{display:flex;align-items:center;justify-content:space-between;min-height:53px;padding:0 12px 0 18px;background:linear-gradient(90deg,rgba(255,255,255,.075),rgba(255,255,255,.018));border-bottom:1px solid var(--line);cursor:move;touch-action:none}
.titlebar strong{font-size:13px;letter-spacing:.01em}
.window-controls{display:flex;gap:5px}
.window-controls button{width:32px;height:32px;padding:0;border:0;border-radius:10px;font-size:16px}
.window-controls .close:hover{background:#bd4242}
.window-content{flex:1;padding:20px;overflow:auto;user-select:text}
.window-content h2{font-size:22px;margin:0 0 14px;letter-spacing:-.025em}
.window-content h3{font-size:15px;margin:0 0 8px}
.muted{color:var(--muted);font-size:13px;line-height:1.55}
.section{margin-bottom:18px}
.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.row>*{flex:1}
.app-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:11px}
.app-card{display:flex;flex-direction:column;align-items:flex-start;gap:9px;text-align:left;min-height:105px;padding:15px;border-radius:17px;background:rgba(255,255,255,.055)}
.app-card span:first-child{font-size:27px}
.setting-card{padding:15px;border:1px solid var(--line);border-radius:17px;margin-bottom:12px;background:rgba(255,255,255,.045)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.06);font-size:11px;color:var(--muted)}
#taskbar{position:fixed;left:50%;bottom:13px;transform:translateX(-50%);width:min(780px,calc(100vw - 22px));height:58px;display:flex;align-items:center;gap:8px;padding:7px 10px;background:rgba(15,17,27,.66);border:1px solid rgba(255,255,255,.14);border-radius:21px;backdrop-filter:blur(30px) saturate(150%);box-shadow:0 12px 45px #0005;z-index:10000}
#startButton{width:43px;height:43px;padding:0;font-size:21px;color:var(--accent);border-radius:15px;background:var(--accent-soft)}
#taskApps{display:flex;gap:5px;flex:1;overflow:auto;scrollbar-width:none}
.task-app{min-width:42px;height:42px;padding:5px 10px;position:relative;border-color:transparent;background:transparent;font-size:18px}
.task-app.active{background:rgba(255,255,255,.12)}
.task-app.active:after{content:"";position:absolute;bottom:2px;left:35%;width:30%;height:3px;border-radius:5px;background:var(--accent)}
#systemTray{display:flex;align-items:center;gap:5px}
.tray-button{width:40px;height:40px;padding:0;border:0;background:transparent}
#clock{min-width:78px;text-align:center;font-size:11px;line-height:1.4;cursor:pointer;padding:5px;border-radius:10px}
#clock:hover{background:rgba(255,255,255,.1)}
#startMenu,#quickPanel,#notificationPanel{position:fixed;z-index:10001;bottom:82px;background:var(--glass-strong);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);backdrop-filter:blur(32px) saturate(150%);display:none;animation:panelIn .18s ease-out}
#startMenu.show,#quickPanel.show,#notificationPanel.show{display:block}
#startMenu{left:12px;width:min(420px,calc(100vw - 24px));padding:19px;max-height:min(620px,calc(100vh - 105px));overflow:auto}
#startMenu h2{margin:0 0 14px}
#startSearch{margin-bottom:14px}
#startApps{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.start-app{padding:13px 5px;text-align:center;border-radius:14px;cursor:pointer;font-size:12px;transition:.18s}
.start-app:hover{background:rgba(255,255,255,.1);transform:translateY(-2px)}
.start-app span{display:block;font-size:25px;margin-bottom:6px}
#quickPanel{right:12px;width:285px;padding:17px}
#notificationPanel{right:12px;width:min(340px,calc(100vw - 24px));padding:17px}
#notificationList{max-height:300px;overflow:auto}
.notification{padding:12px;margin:8px 0;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.045);border-radius:14px;font-size:13px}
#contextMenu{display:none;position:fixed;z-index:10002;background:var(--glass-strong);border:1px solid var(--line);border-radius:14px;padding:7px;min-width:190px;box-shadow:var(--shadow);backdrop-filter:blur(25px)}
#contextMenu button{display:block;width:100%;text-align:left;border:0;background:transparent}
#contextMenu button:hover{background:rgba(255,255,255,.1)}
#assistantOutput{min-height:80px;padding:13px;border:1px solid var(--line);border-radius:14px;background:rgba(0,0,0,.18);font-size:13px;white-space:pre-wrap}
.accent-option{width:36px;height:36px;border-radius:50%;border:2px solid rgba(255,255,255,.7);padding:0}
#wallpaperChoices{display:flex;gap:10px;flex-wrap:wrap}
.wallpaper-option{width:82px;height:54px;border-radius:12px;border:2px solid var(--line);padding:0}
.phone-number{font-size:19px;text-align:center}
#calculatorDisplay{font-size:27px;text-align:right;margin-bottom:12px;font-variant-numeric:tabular-nums}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.calc-grid button{font-size:17px;padding:14px 5px;border-radius:13px}
#terminalOutput{font-family:Consolas,monospace;white-space:pre-wrap;font-size:13px;color:#b6f5bd;min-height:170px;line-height:1.55}
#terminalInput{font-family:Consolas,monospace}
#modalLayer{position:fixed;inset:0;z-index:30000;display:none;place-items:center;background:rgba(0,0,0,.48);backdrop-filter:blur(9px);padding:18px}
#modalLayer.show{display:grid;animation:fadeIn .15s}
.modal{width:min(420px,100%);padding:24px;background:var(--glass-strong);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);animation:modalIn .2s}
.modal h2{margin:0 0 9px;font-size:23px}
.modal p{color:var(--muted);font-size:14px;line-height:1.55}
.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:22px}
#devBadge{position:fixed;top:13px;right:14px;z-index:12000;display:none;padding:7px 11px;border-radius:999px;background:rgba(255,190,80,.16);border:1px solid rgba(255,190,80,.4);color:#ffd77b;font-size:11px;font-weight:750;letter-spacing:.08em;backdrop-filter:blur(12px)}
#devBadge.show{display:block}
#toastArea{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:20000;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{padding:11px 16px;border:1px solid var(--line);border-radius:14px;background:var(--glass-strong);box-shadow:0 12px 35px #0004;backdrop-filter:blur(20px);font-size:13px;animation:toastIn .22s ease-out}
.accent-line{height:3px;width:45px;border-radius:9px;background:var(--accent);margin-bottom:13px}
@keyframes bootRise{from{opacity:0;transform:translateY(15px) scale(.97)}to{opacity:1;transform:none}}
@keyframes bootLoad{0%{transform:translateX(-120%)}100%{transform:translateX(260%)}}
@keyframes starFlash{from{opacity:.38;transform:scale(.78)}to{opacity:1;transform:scale(1.18)}}
@keyframes desktopIn{to{opacity:1}}
@keyframes windowIn{from{opacity:0;transform:translateY(12px) scale(.975)}to{opacity:1;transform:none}}
@keyframes panelIn{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
@keyframes modalIn{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes toastIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@media(max-width:600px){
  #desktopIcons{grid-template-columns:repeat(2,78px);width:175px;padding:13px;gap:5px}
  .window{left:8px!important;top:8px!important;width:calc(100vw - 16px)!important;height:calc(100vh - 100px)!important;min-width:0}
  .window.maximized{inset:5px!important}
  #taskbar{bottom:7px;height:56px;width:calc(100vw - 14px);border-radius:18px}
  #systemTray{gap:1px}.tray-button{width:35px}
  #clock{min-width:61px;font-size:10px}
  .desktop-icon{font-size:11px}
  .window-content{padding:15px}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="bootScreen" aria-label="XDL OS is starting">
  <div class="boot-inner">
    <div class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 100 100">
        <path d="M19 19 L81 81 M81 19 L19 81" stroke="white" stroke-width="13" stroke-linecap="round" opacity=".94"/>
        <path d="M19 19 L81 81 M81 19 L19 81" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" opacity=".9"/>
        <path class="star" d="M19 70 L22 78 L30 81 L22 84 L19 92 L16 84 L8 81 L16 78 Z"/>
        <path class="star two" d="M81 8 L84 16 L92 19 L84 22 L81 30 L78 22 L70 19 L78 16 Z"/>
      </svg>
    </div>
    <div class="boot-title">XDL OS</div>
    <div class="boot-sub">XDEADER LABORATORIES</div>
    <div class="boot-progress"></div>
  </div>
</div>

<div id="desktop">
  <div id="ambientGlow"></div>
  <div id="desktopIcons">
    <div class="desktop-icon" ondblclick="openApp('files')" tabindex="0"><span class="emoji">📁</span>Files</div>
    <div class="desktop-icon" ondblclick="openApp('notes')" tabindex="0"><span class="emoji">📝</span>Notes</div>
    <div class="desktop-icon" ondblclick="openApp('calculator')" tabindex="0"><span class="emoji">🧮</span>Calculator</div>
    <div class="desktop-icon" ondblclick="openApp('phone')" tabindex="0"><span class="emoji">📞</span>Phone</div>
    <div class="desktop-icon" ondblclick="openApp('settings')" tabindex="0"><span class="emoji">⚙️</span>Settings</div>
    <div class="desktop-icon" ondblclick="openApp('assistant')" tabindex="0"><span class="emoji">🤖</span>XDL Assistant</div>
  </div>
  <div id="windows"></div>
</div>

<div id="startMenu">
  <div class="accent-line"></div><h2>Welcome back.</h2>
  <input id="startSearch" placeholder="Search apps..." oninput="filterStartApps(this.value)">
  <div id="startApps"></div>
  <div class="row" style="margin-top:16px"><span class="muted">XDL OS 1.3.0</span><button onclick="openApp('settings');toggleStart()">⚙️ Settings</button></div>
</div>
<div id="quickPanel">
  <div class="accent-line"></div><h3 style="margin-top:0">Quick controls</h3>
  <button style="width:100%;margin-bottom:8px" onclick="toggleFullscreen()">⛶ Toggle fullscreen</button>
  <button style="width:100%;margin-bottom:8px" onclick="openApp('settings')">🎨 Personalization</button>
  <button style="width:100%" onclick="openApp('phone')">📞 Phone</button>
  <p class="muted">XDL OS 1.3.0</p>
</div>
<div id="notificationPanel">
  <div class="row"><strong>Notifications</strong><button onclick="clearNotifications()">Clear all</button></div>
  <div id="notificationList"></div>
</div>
<div id="contextMenu">
  <button onclick="openApp('assistant');hideContext()">🤖 XDL Assistant</button>
  <button onclick="openApp('notes');hideContext()">📝 New note</button>
  <button onclick="openApp('settings');hideContext()">⚙️ Settings</button>
  <button onclick="hideContext()">Close menu</button>
</div>
<div id="taskbar">
  <button id="startButton" onclick="toggleStart()" title="Start menu">✳</button>
  <div id="taskApps"></div>
  <div id="systemTray">
    <button class="tray-button" onclick="toggleQuick()" title="Quick controls">⌘</button>
    <button class="tray-button" onclick="toggleNotifications()" title="Notifications">♧</button>
    <div id="clock" onclick="openApp('calendar')" title="Open calendar"></div>
  </div>
</div>
<div id="devBadge">◆ DEVELOPER MODE</div>
<div id="toastArea"></div>
<div id="modalLayer" role="dialog" aria-modal="true">
  <div class="modal">
    <div class="accent-line"></div>
    <h2 id="modalTitle">Are you sure?</h2>
    <p id="modalMessage">This action cannot be undone.</p>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<script>
"use strict";
const VERSION="1.3.0";
const apps={
  files:{name:"File Explorer",icon:"📁"},
  notes:{name:"Notes",icon:"📝"},
  calculator:{name:"Calculator",icon:"🧮"},
  settings:{name:"Settings",icon:"⚙️"},
  phone:{name:"Phone",icon:"📞"},
  calendar:{name:"Calendar",icon:"📅"},
  terminal:{name:"Terminal",icon:"⌨️"},
  assistant:{name:"XDL Assistant",icon:"🤖"},
  about:{name:"About XDL OS",icon:"✦"}
};
let zIndex=10,activeApp=null,notifications=[],calcValue="0",calcExpression="",notesTimer=null,dragState=null;
let developerMode=false;
const $=id=>document.getElementById(id);
const wallpapers=[
 "radial-gradient(ellipse at 18% 15%,#47345f 0,transparent 38%),radial-gradient(ellipse at 82% 85%,#8d493b 0,transparent 42%),linear-gradient(135deg,#111827,#17152c 55%,#241a2b)",
 "radial-gradient(ellipse at 20% 80%,#126b79 0,transparent 40%),radial-gradient(ellipse at 85% 10%,#244f75 0,transparent 38%),linear-gradient(135deg,#071e30,#123d50 60%,#142b3a)",
 "radial-gradient(ellipse at 75% 20%,#8c4a83 0,transparent 40%),radial-gradient(ellipse at 15% 90%,#3e326d 0,transparent 42%),linear-gradient(135deg,#171329,#382650 60%,#512b4a)",
 "radial-gradient(ellipse at 80% 85%,#75834c 0,transparent 40%),radial-gradient(ellipse at 15% 10%,#31534b 0,transparent 42%),linear-gradient(135deg,#101b22,#263f3a 60%,#35402b)"
];
function safeStorageGet(key,fallback=""){try{return localStorage.getItem(key)??fallback}catch{return fallback}}
function safeStorageSet(key,value){try{localStorage.setItem(key,value)}catch{notify("Storage unavailable","Your browser may be blocking local storage.")}}
function escapeHTML(value){return String(value).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function notify(title,message){
 notifications.unshift({title,message,time:new Date().toLocaleTimeString()});
 notifications=notifications.slice(0,30);renderNotifications();
 const toast=document.createElement("div");toast.className="toast";toast.textContent=title+" — "+message;$("toastArea").appendChild(toast);
 setTimeout(()=>toast.remove(),3300);
}
function renderNotifications(){
 $("notificationList").innerHTML=notifications.length?notifications.map(n=>'<div class="notification"><strong>'+escapeHTML(n.title)+'</strong><br>'+escapeHTML(n.message)+'<div class="muted">'+escapeHTML(n.time)+'</div></div>').join(""):'<p class="muted">No notifications.</p>';
}
function clearNotifications(){notifications=[];renderNotifications();notify("Notifications","Notification center cleared.")}
function togglePanel(id){
 ["startMenu","quickPanel","notificationPanel"].forEach(x=>{if(x!==id)$(x).classList.remove("show")});
 $(id).classList.toggle("show");
 if(id==="startMenu"&&$("startMenu").classList.contains("show"))$("startSearch").focus();
}
function toggleStart(){togglePanel("startMenu")}
function toggleQuick(){togglePanel("quickPanel")}
function toggleNotifications(){togglePanel("notificationPanel")}
function hideContext(){$("contextMenu").style.display="none"}
function toggleFullscreen(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}
function updateClock(){
 const now=new Date();
 $("clock").innerHTML=now.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})+"<br>"+now.toLocaleDateString([],{month:"short",day:"numeric"});
}
setInterval(updateClock,1000);updateClock();
function renderStartApps(filter=""){
 const list=Object.entries(apps).filter(([id,a])=>(a.name+" "+id).toLowerCase().includes(filter.toLowerCase()));
 $("startApps").innerHTML=list.map(([id,a])=>'<div class="start-app" onclick="openApp(\''+id+'\');toggleStart()"><span>'+a.icon+'</span>'+a.name+'</div>').join("");
}
function filterStartApps(value){renderStartApps(value)}
renderStartApps();

const appContent={
 files:()=>'<h2>File Explorer</h2><p class="muted">Your XDL workspace, organized.</p><div class="app-grid"><button class="app-card" onclick="notify(\'Files\',\'Documents is a demo folder.\')"><span>📂</span><strong>Documents</strong><small class="muted">Workspace folder</small></button><button class="app-card" onclick="notify(\'Files\',\'Pictures is a demo folder.\')"><span>🖼️</span><strong>Pictures</strong><small class="muted">Image workspace</small></button><button class="app-card" onclick="notify(\'Files\',\'Downloads is a demo folder.\')"><span>📥</span><strong>Downloads</strong><small class="muted">Download workspace</small></button><button class="app-card" onclick="notify(\'Files\',\'System is a demo folder.\')"><span>💻</span><strong>System</strong><small class="muted">XDL OS files</small></button></div><div class="setting-card" style="margin-top:14px"><strong>📁 This PC</strong><p class="muted">This is a visual workspace demo. It cannot browse or change your device files.</p></div>',
 notes:()=>'<h2>Notes</h2><p class="muted">Notes are saved locally in this browser on this device.</p><textarea id="notesArea" placeholder="Write something worth remembering..."></textarea><div class="row" style="margin-top:10px"><button class="primary" onclick="saveNotes()">Save notes</button><span id="notesStatus" class="muted">Ready</span></div>',
 calculator:()=>'<h2>Calculator</h2><input id="calculatorDisplay" value="0" readonly><div class="calc-grid">'+["7","8","9","÷","4","5","6","×","1","2","3","−","0",".","=","+"].map(v=>'<button onclick="calcPress(\''+v+'\')">'+v+'</button>').join("")+'<button onclick="calcClear()" style="grid-column:span 4">Clear</button></div><p class="muted">Supports basic arithmetic and parentheses through keyboard input is not enabled.</p>',
 settings:()=>'<h2>Settings</h2><div class="setting-card"><h3>Personalization</h3><p class="muted">Choose an accent color for the interface.</p><div class="row">'+["#ff9b55","#5ca8ff","#bd7aff","#4bd6a1","#ff5d83","#f3c94f","#e7e9f5"].map(c=>'<button class="accent-option" style="background:'+c+'" onclick="setAccent(\''+c+'\')" title="'+c+'"></button>').join("")+'</div></div><div class="setting-card"><h3>Wallpaper</h3><p class="muted">Choose a desktop atmosphere.</p><div id="wallpaperChoices">'+wallpapers.map((w,i)=>'<button class="wallpaper-option" style="background:'+w+'" onclick="setWallpaper('+i+')" aria-label="Wallpaper '+(i+1)+'"></button>').join("")+'</div></div><div class="setting-card"><h3>System</h3><p class="muted">XDL OS 1.3.0 · XDeader Laboratories</p><button onclick="openApp(\'about\')">✦ About XDL OS</button></div><div class="setting-card"><h3>Keyboard shortcuts</h3><p class="muted">Ctrl + Space — Start menu<br>Ctrl + Shift + N — Notes<br>F2 — Toggle developer mode<br>F5 — System reset confirmation<br>Esc — Close menus</p></div>',
 phone:()=>'<h2>Phone</h2><p class="muted">Use your device\'s configured calling app to place a call.</p><div class="section"><label for="phoneNumber">Phone number</label><input id="phoneNumber" class="phone-number" type="tel" placeholder="+1 555 123 4567" autocomplete="tel"></div><div class="row"><button class="primary" onclick="makeCall()">📞 Open calling app</button><button onclick="clearPhoneNumber()">Clear</button></div><p class="muted">Your device will ask you to confirm the call. XDL OS does not place calls automatically.</p><div class="setting-card"><strong>Compatibility</strong><p class="muted">Mobile devices use their configured phone handler. Windows may use Phone Link if configured.</p></div>',
 calendar:()=>'<h2>Calendar</h2><div class="setting-card"><div style="font-size:34px">📅</div><h3 id="calendarToday"></h3><strong id="calendarDate"></strong><p class="muted">Your device\'s local date and time.</p></div><button onclick="notify(\'Calendar\',\'Today is \'+new Date().toLocaleDateString())">Create test notification</button>',
 terminal:()=>'<h2>Terminal</h2><div id="terminalOutput">XDL OS Terminal 1.3.0\nType "help" to see available commands.\n</div><input id="terminalInput" placeholder="Enter a command..." onkeydown="if(event.key===\'Enter\')runTerminal()">',
 assistant:()=>'<h2>🤖 XDL Assistant</h2><p class="muted">A local command assistant. It runs supported commands; it does not connect to an online AI service.</p><div class="section"><input id="assistantInput" placeholder="Try: Open Notes" onkeydown="if(event.key===\'Enter\')runAssistant()"></div><div class="row"><button class="primary" onclick="runAssistant()">Run command</button><button onclick="$(\'assistantInput\').value=\'\';$(\'assistantOutput\').textContent=\'Ready.\'">Clear</button></div><div class="section" style="margin-top:14px"><strong>Output</strong><div id="assistantOutput" style="margin-top:8px">Ready. Awaiting command.</div></div><div class="setting-card"><strong>Try these commands</strong><p class="muted">Open Notes · Open Calculator · Open Files · Open Settings · Open Phone · Open Calendar · Open Terminal · Show Desktop · Minimize All · Toggle Fullscreen · Change Wallpaper · About</p></div>',
 about:()=>'<div class="setting-card"><div style="font-size:43px">✦</div><h2 style="margin:7px 0">XDL OS</h2><p class="muted">A project by XDeader Laboratories</p><span class="pill">VERSION 1.3.0</span><p class="muted" style="margin-top:15px">A browser-based desktop environment with a redesigned interface, glass panels, a new boot sequence, and session-only developer tools.</p></div><h3>What\'s new in 1.3.0?</h3><ul><li>Complete visual redesign</li><li>New animated boot screen and XDL logo</li><li>Refined glass panels and One UI-inspired details</li><li>New notifications and toast messages</li><li>F2 session-only developer mode</li><li>F5 custom system reset confirmation</li><li>Keyboard shortcuts and Easter eggs</li></ul><p class="muted">XDL OS is a browser-based desktop environment. It does not replace your operating system.</p>'
};
function openApp(id){
 if(!apps[id])return;
 const existing=$("window-"+id);
 if(existing){existing.classList.remove("hidden");existing.style.zIndex=++zIndex;activeApp=id;renderTaskbar();return}
 const win=document.createElement("div");win.className="window";win.id="window-"+id;
 win.style.left=Math.max(10,Math.min(window.innerWidth-520,90+Object.keys(apps).indexOf(id)*24))+"px";
 win.style.top=Math.max(10,Math.min(window.innerHeight-420,45+Object.keys(apps).indexOf(id)*18))+"px";
 win.style.zIndex=++zIndex;
 win.innerHTML='<div class="titlebar" onpointerdown="startDrag(event,\''+id+'\')"><strong>'+apps[id].icon+' '+apps[id].name+'</strong><div class="window-controls"><button onclick="minimizeApp(\''+id+'\')" title="Minimize">−</button><button onclick="maximizeApp(\''+id+'\')" title="Maximize">□</button><button class="close" onclick="closeApp(\''+id+'\')" title="Close">×</button></div></div><div class="window-content">'+appContent[id]()+'</div>';
 $("windows").appendChild(win);activeApp=id;
 if(id==="notes"){
  $("notesArea").value=safeStorageGet("xdlNotes");
  $("notesArea").addEventListener("input",()=>{$("notesStatus").textContent="Unsaved changes";clearTimeout(notesTimer);notesTimer=setTimeout(saveNotes,700)});
 }
 if(id==="calendar"){$("calendarToday").textContent=new Date().toLocaleDateString([],{weekday:"long"});$("calendarDate").textContent=new Date().toLocaleDateString([],{year:"numeric",month:"long",day:"numeric"})}
 renderTaskbar();
}
function closeApp(id){$("window-"+id)?.remove();if(activeApp===id)activeApp=null;renderTaskbar()}
function minimizeApp(id){$("window-"+id)?.classList.add("hidden");if(activeApp===id)activeApp=null;renderTaskbar()}
function maximizeApp(id){$("window-"+id)?.classList.toggle("maximized")}
function minimizeAll(){document.querySelectorAll(".window").forEach(w=>w.classList.add("hidden"));activeApp=null;renderTaskbar()}
function renderTaskbar(){$("taskApps").innerHTML=Object.keys(apps).filter(id=>$("window-"+id)).map(id=>'<button class="task-app '+(activeApp===id?"active":"")+'" onclick="taskAppClick(\''+id+'\')" title="'+apps[id].name+'">'+apps[id].icon+'</button>').join("")}
function taskAppClick(id){const w=$("window-"+id);if(!w)return;if(!w.classList.contains("hidden")&&activeApp===id)minimizeApp(id);else{w.classList.remove("hidden");w.style.zIndex=++zIndex;activeApp=id;renderTaskbar()}}
function startDrag(e,id){
 if(e.target.closest("button"))return;
 const w=$("window-"+id);if(w.classList.contains("maximized"))return;
 dragState={id:id,x:e.clientX,y:e.clientY,left:w.offsetLeft,top:w.offsetTop};w.style.zIndex=++zIndex;activeApp=id;
 try{e.currentTarget.setPointerCapture(e.pointerId)}catch{}
}
document.addEventListener("pointermove",e=>{if(!dragState)return;const w=$("window-"+dragState.id);if(!w)return;w.style.left=Math.max(0,dragState.left+e.clientX-dragState.x)+"px";w.style.top=Math.max(0,dragState.top+e.clientY-dragState.y)+"px"});
document.addEventListener("pointerup",()=>dragState=null);
function saveNotes(){const area=$("notesArea");if(!area)return;safeStorageSet("xdlNotes",area.value);$("notesStatus").textContent="Saved locally ✓"}
function setAccent(color){
 if(!/^#[0-9a-f]{6}$/i.test(color))return;
 document.documentElement.style.setProperty("--accent",color);
 const rgb=color.match(/[0-9a-f]{2}/ig).map(x=>parseInt(x,16)).join(",");
 document.documentElement.style.setProperty("--accent-rgb",rgb);
 safeStorageSet("xdlAccent",color);notify("Personalization","Accent color updated.");
}
function setWallpaper(index){if(!wallpapers[index])return;document.body.style.background=wallpapers[index];document.documentElement.style.setProperty("--wallpaper",wallpapers[index]);safeStorageSet("xdlWallpaper",String(index));notify("Wallpaper","Desktop atmosphere updated.")}
function makeCall(){
 const input=$("phoneNumber"),number=input?.value.trim()||"";
 if(!number){notify("Phone","Enter a phone number first.");return}
 if(!/^[+0-9().\-\s]+$/.test(number)){notify("Phone","That number contains unsupported characters.");return}
 const normalized=number.replace(/[^\d+]/g,"");
 if(normalized.replace(/\D/g,"").length<3){notify("Phone","Please enter a valid phone number.");return}
 window.location.href="tel:"+normalized;
}
function clearPhoneNumber(){if($("phoneNumber"))$("phoneNumber").value=""}

/* Small arithmetic parser: evaluates only numeric arithmetic, never JavaScript code. */
function evaluateMath(source){
 const tokens=source.match(/\d*\.?\d+|[()+\-*/]/g)||[];
 if(tokens.join("")!==source.replace(/\s/g,""))throw Error("Invalid expression");
 let pos=0;
 function primary(){
  const t=tokens[pos++];
  if(t==="("){const v=expression();if(tokens[pos++]!==")")throw Error("Missing )");return v}
  if(t==="+")return primary();
  if(t==="-")return -primary();
  const n=Number(t);if(!Number.isFinite(n))throw Error("Number expected");return n;
 }
 function term(){let v=primary();while(tokens[pos]==="*"||tokens[pos]==="/"){const op=tokens[pos++],r=primary();v=op==="*"?v*r:v/r}return v}
 function expression(){let v=term();while(tokens[pos]==="+"||tokens[pos]==="-"){const op=tokens[pos++],r=term();v=op==="+"?v+r:v-r}return v}
 const result=expression();if(pos!==tokens.length||!Number.isFinite(result))throw Error("Invalid calculation");return result;
}
function calcPress(value){
 if(value==="="){try{if(!calcExpression)return;const result=evaluateMath(calcExpression);calcValue=String(Number(result.toFixed(8)));calcExpression=calcValue}catch{calcValue="Error";calcExpression=""}}
 else{const map={"÷":"/","×":"*","−":"-"};if(calcValue==="Error"){calcValue="0";calcExpression=""}calcExpression+=map[value]||value;calcValue=calcExpression}
 if($("calculatorDisplay"))$("calculatorDisplay").value=calcValue;
}
function calcClear(){calcValue="0";calcExpression="";if($("calculatorDisplay"))$("calculatorDisplay").value="0"}
function runAssistant(){
 const input=$("assistantInput"),output=$("assistantOutput");if(!input||!output)return;
 const command=input.value.trim().toLowerCase();if(!command){output.textContent="Please enter a command.";return}
 const aliases={"open notes":"notes","open note":"notes","open calculator":"calculator","open files":"files","open file explorer":"files","open settings":"settings","open phone":"phone","open calendar":"calendar","open terminal":"terminal","open about":"about","open about xdl os":"about"};
 if(aliases[command]){const id=aliases[command];output.textContent="Launching "+apps[id].name+"...";openApp(id);return}
 if(command==="show desktop"||command==="minimize all"){minimizeAll();output.textContent="Desktop displayed.";return}
 if(command==="toggle fullscreen"){toggleFullscreen();output.textContent="Fullscreen command sent.";return}
 if(command==="change wallpaper"){const current=Number(safeStorageGet("xdlWallpaper","0"));setWallpaper((current+1)%wallpapers.length);output.textContent="Wallpaper changed.";return}
 if(command==="what time is it"||command==="show time"){output.textContent="Current time: "+new Date().toLocaleTimeString();return}
 if(command==="what version is this"||command==="version"){output.textContent="XDL OS version "+VERSION;return}
 if(command==="hello xdl"||command==="hello"){output.textContent="Hello, Operator. XDL systems are ready.";return}
 if(command==="who built you"){output.textContent="XDL OS was created as a project by XDeader Laboratories.";return}
 output.textContent='Unknown command. Try "Open Notes", "Open Calculator", "Show Desktop", or "Change Wallpaper".';
}
function runTerminal(){
 const input=$("terminalInput"),output=$("terminalOutput");if(!input||!output)return;
 const command=input.value.trim().toLowerCase();input.value="";
 const responses={
  help:"Available commands: help, version, time, apps, clear, open notes, open calculator, open files, open settings, open phone, open assistant, desktop, whoami",
  version:"XDL OS "+VERSION,time:new Date().toLocaleString(),apps:Object.keys(apps).join(", "),
  "open notes":()=>openApp("notes"),"open calculator":()=>openApp("calculator"),"open files":()=>openApp("files"),
  "open settings":()=>openApp("settings"),"open phone":()=>openApp("phone"),"open assistant":()=>openApp("assistant"),
  desktop:()=>minimizeAll(),whoami:()=>"XDL OS local user session"
 };
 if(command==="clear"){output.textContent="";return}
 const response=responses[command];
 if(typeof response==="function"){response();output.textContent+="\n> "+command+"\nCommand executed."}
 else output.textContent+="\n> "+command+"\n"+(response||"Command not found. Type help.");
 output.scrollTop=output.scrollHeight;
}
function showModal(title,message,actions){
 $("modalTitle").textContent=title;$("modalMessage").textContent=message;
 $("modalActions").innerHTML="";
 actions.forEach(action=>{
  const b=document.createElement("button");b.textContent=action.label;b.className=action.className||"";
  b.addEventListener("click",()=>{closeModal();action.run()});$("modalActions").appendChild(b);
 });
 $("modalLayer").classList.add("show");
}
function closeModal(){$("modalLayer").classList.remove("show")}
function confirmReset(){
 showModal("Are you sure?","This action cannot be undone.",[
  {label:"Cancel ❌",run:()=>notify("Reset cancelled","Your XDL OS data was not changed.")},
  {label:"Reset ✔️",className:"primary",run:resetXDLData}
 ]);
}
function resetXDLData(){
 const keysToRemove=["xdlNotes","xdlAccent","xdlWallpaper"];
 try{
  keysToRemove.forEach(k=>localStorage.removeItem(k));
  /* Remove only additional XDL-prefixed keys; leave unrelated website data untouched. */
  for(let i=localStorage.length-1;i>=0;i--){const key=localStorage.key(i);if(key&&/^xdl(?:[-_:]|[A-Z])/.test(key))localStorage.removeItem(key)}
 }catch{}
 location.reload();
}
function setDeveloperMode(enabled){
 developerMode=enabled;$("devBadge").classList.toggle("show",enabled);
 notify("Developer mode",enabled?"Developer privileges enabled for this session.":"Developer privileges disabled.");
}
function developerCommand(){
 if(!developerMode){notify("Developer mode","Press F2 to enable session-only developer privileges.");return}
 showModal("Developer console","Developer mode is active for this page session. This does not grant access to your device or browser internals.",[
  {label:"Disable",run:()=>setDeveloperMode(false)},
  {label:"Close",className:"primary",run:()=>{}}
 ]);
}
function easterEgg(){
 notify("XDL Easter egg","You found the hidden signal. Two stars are watching the system. ✦");
}
document.addEventListener("keydown",e=>{
 if(e.key==="Escape"){
  $("startMenu").classList.remove("show");$("quickPanel").classList.remove("show");$("notificationPanel").classList.remove("show");hideContext();closeModal();
 }
 if(e.key==="F2"){e.preventDefault();setDeveloperMode(!developerMode)}
 if(e.key==="F5"){e.preventDefault();confirmReset()}
 if(e.ctrlKey&&e.code==="Space"){e.preventDefault();toggleStart()}
 if(e.ctrlKey&&e.shiftKey&&e.key.toLowerCase()==="n"){e.preventDefault();openApp("notes")}
 if(e.altKey&&e.key==="Tab"){
  const visible=Object.keys(apps).filter(id=>$("window-"+id));
  if(visible.length){e.preventDefault();const index=visible.indexOf(activeApp);taskAppClick(visible[(index+1)%visible.length])}
 }
 if(e.key==="F12"&&developerMode){e.preventDefault();developerCommand()}
});
$("desktop").addEventListener("contextmenu",e=>{
 if(e.target.closest(".window"))return;e.preventDefault();
 const menu=$("contextMenu");menu.style.display="block";
 menu.style.left=Math.min(e.clientX,window.innerWidth-200)+"px";
 menu.style.top=Math.min(e.clientY,window.innerHeight-190)+"px";
});
document.addEventListener("click",e=>{
 if(!e.target.closest("#contextMenu"))hideContext();
 if(!e.target.closest("#startMenu")&&!e.target.closest("#startButton"))$("startMenu").classList.remove("show");
 if(!e.target.closest("#quickPanel")&&!e.target.closest("#systemTray button:first-child"))$("quickPanel").classList.remove("show");
 if(!e.target.closest("#notificationPanel")&&!e.target.closest("#systemTray button:nth-child(2)"))$("notificationPanel").classList.remove("show");
});
function loadPreferences(){
 const accent=safeStorageGet("xdlAccent");
 if(accent&&/^#[0-9a-f]{6}$/i.test(accent)){
  document.documentElement.style.setProperty("--accent",accent);
  document.documentElement.style.setProperty("--accent-rgb",accent.match(/[0-9a-f]{2}/ig).map(x=>parseInt(x,16)).join(","));
 }
 const wallpaper=Number(safeStorageGet("xdlWallpaper","0"));
 if(wallpapers[wallpaper])document.body.style.background=wallpapers[wallpaper];
}
loadPreferences();renderNotifications();
setTimeout(()=>{$("desktop").classList.add("ready");$("bootScreen").classList.add("done");notify("XDL OS","Welcome to XDL OS 1.3.0.");},1550);
document.querySelector(".brand-mark").addEventListener("click",easterEgg);
</script>
